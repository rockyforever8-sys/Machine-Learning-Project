name: Deploy AI Image Generator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'image-generator/**'
      - '.github/workflows/deploy-image-generator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: image-generator/package-lock.json

      - name: Install & Build
        working-directory: image-generator
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - name: Prepare static files
        run: |
          rm -rf docs
          cp -r image-generator/dist docs
          touch docs/.nojekyll
          cp docs/index.html docs/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

      - name: Commit docs folder to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update docs for GitHub Pages [skip ci]"
          git push
