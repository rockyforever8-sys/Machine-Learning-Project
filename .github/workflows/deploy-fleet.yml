name: Deploy Fleet Commander to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'fleet-commander/**'
      - '.github/workflows/deploy-fleet.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fleet-commander/package-lock.json

      - name: Install & Build
        working-directory: fleet-commander
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fleet-commander/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
